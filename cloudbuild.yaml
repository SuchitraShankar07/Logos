steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/multi-agent-debugger', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/multi-agent-debugger']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - multi-agent-debugger
      - --image=gcr.io/$PROJECT_ID/multi-agent-debugger
      - --region=asia-southeast1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8000
      - --memory=1Gi
      - --cpu=1
      - --max-instances=10
      - --set-env-vars=GEMINI_MODEL=gemini-2.0-flash
